<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Timetable Creator</title>
 
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
 
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <!-- ── HEADER ── -->
  <div class="header">
    <div class="header-icon">📚</div>
    <h1>Study Timetable Creator</h1>
    <p>Plan your week, ace your goals</p>
  </div>
 
  <!-- ── MAIN CARD ── -->
  <div class="main-card">
 
    <!-- Day Tabs -->
    <div class="day-tabs" id="dayTabs">
      <div class="day-tab active" data-day="Mon">Mon</div>
      <div class="day-tab" data-day="Tue">Tue</div>
      <div class="day-tab" data-day="Wed">Wed</div>
      <div class="day-tab" data-day="Thu">Thu</div>
      <div class="day-tab" data-day="Fri">Fri</div>
      <div class="day-tab" data-day="Sat">Sat</div>
      <div class="day-tab" data-day="Sun">Sun</div>
    </div>
 
    <!-- Form -->
    <div class="section-label">Session Details</div>
 
    <div class="field">
      <label>Subject</label>
      <input type="text" id="inp-subject" placeholder="e.g., Mathematics" maxlength="30" />
    </div>
 
    <div class="row2">
      <div class="field">
        <label>Start Time</label>
        <input type="time" id="inp-time" />
      </div>
      <div class="field">
        <label>Duration</label>
        <select id="inp-dur">
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60" selected>1 hour</option>
          <option value="90">1.5 hours</option>
          <option value="120">2 hours</option>
          <option value="150">2.5 hours</option>
          <option value="180">3 hours</option>
        </select>
      </div>
    </div>
 
    <div class="field">
      <label>Goal / Task</label>
      <input type="text" id="inp-goal" placeholder="e.g., Practice algebra problems" maxlength="60" />
    </div>
 
    <div class="field">
      <label>Color Tag</label>
      <div class="color-row" id="colorPicker"></div>
    </div>
 
    <button class="btn-add" onclick="addSession()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="2"/>
        <path d="M12 8v8M8 12h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Add to Timetable
    </button>
 
    <!-- Timetable Display -->
    <div class="divider">Your Timetable</div>
 
    <div class="timetable-header">
      <div class="timetable-title">
        <span>🗓</span>
        <span id="viewDayLabel">Monday</span>
        <span class="count-badge" id="countBadge">0</span>
      </div>
      <select id="viewDaySelect" onchange="renderSessions()"
        style="font-size:12px;padding:5px 10px;border-radius:8px;border:1.5px solid #E2DFF9;font-family:Nunito,sans-serif;color:#2D2B55;background:#FAFAFE;cursor:pointer;outline:none;">
        <option>Mon</option>
        <option>Tue</option>
        <option>Wed</option>
        <option>Thu</option>
        <option>Fri</option>
        <option>Sat</option>
        <option>Sun</option>
      </select>
    </div>
 
    <div class="sessions-list" id="sessionsList"></div>
 
    <!-- Stats -->
    <div class="stats-row" id="statsRow"></div>
 
    <!-- Download -->
    <button class="btn-download" onclick="downloadTimetable()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
        <path d="M12 3v13M7 11l5 5 5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 20h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Download Weekly Timetable
    </button>
 
  </div>
 
  <!-- Toast notification -->
  <div class="toast" id="toast"></div>
 
  <!-- JavaScript -->
  <script src="script.js"></script>
 
</body>
</html>
